
spring.application.name=atm

# Read datasource configuration from environment variables.
# Credentials must NOT be stored in plaintext inside this file — provide them via
# environment variables, platform secrets, or a secret manager.
# - ATM_DATASOURCE_URL: JDBC URL (optional default kept for local convenience)
# - ATM_DATASOURCE_USERNAME: DB user (REQUIRED)
# - ATM_DATASOURCE_PASSWORD: DB password (REQUIRED)
spring.datasource.url=${ATM_DATASOURCE_URL:jdbc:mysql://localhost:3306/atm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ATM_DATASOURCE_USERNAME}
spring.datasource.password=${ATM_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Let Hibernate auto-detect a suitable dialect for the connected MySQL server
# (remove explicit dialect to avoid warnings for older server versions)
